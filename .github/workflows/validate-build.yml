name: Validate CloudStream extensions

on:
  pull_request:
    branches:
      - main
      - master
  push:
    branches:
      - feature/mon-extension-personnelle
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle 8.14.4
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.14.4"

      - name: Build all extensions
        run: gradle :AfterDark:make :Frembed:make :Flemmix:make :Xalaflix:make :MonExtension:make :AnimeSama:make :SenpaiStream:make makePluginsJson --stacktrace

      - name: Verify generated packages
        shell: bash
        run: |
          set -euo pipefail
          for module in AfterDark Frembed Flemmix Xalaflix MonExtension AnimeSama SenpaiStream; do
            if ! find "$module/build" -maxdepth 1 -type f -name '*.cs3' -print -quit | grep -q .; then
              echo "Missing .cs3 package for $module"
              find "$module/build" -maxdepth 2 -type f -print || true
              exit 1
            fi
          done
          test -s build/plugins.json
